[project]
name = "taskflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "alembic>=1.14.0",
    "arize-phoenix>=21.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.163.1",
    "langgraph>=1.2.22",
    "openai>=3.52.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.7.0",
    "ragas>=0.3.1",
    "requests>=2.34.2",
    "slowapi>=0.1.9",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
